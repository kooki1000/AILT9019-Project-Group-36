[project]
name = "course-planner"
version = "0.1.0"
description = "Semester-by-semester course planner for HKU undergraduates (AILT9019 Group 36)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
